<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escudos de carretera de Europa</title>
<style>
:root{--az:#003399;--am:#FFCC00;--tx:#0e1b3d;--ok:#27ae60;--ko:#e74c3c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#eef2fb;color:var(--tx)}
header{background:linear-gradient(180deg,#0a3fb3,var(--az));border-bottom:5px solid var(--am);padding:10px 18px;display:flex;align-items:center;gap:14px;color:#fff}
header svg{width:54px;height:54px}header .head-main{flex:1}header .back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#fff;color:var(--az);border:2px solid var(--am);font-weight:800;padding:8px 13px;border-radius:10px;white-space:nowrap;transition:.15s}header .back:hover{background:#ffe27a;transform:translateY(-1px)}header h1{margin:0;font-size:1.35rem}header small{opacity:.85}
.tabs{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.tabs button{border:2px solid var(--az);background:#fff;color:var(--az);font-weight:700;padding:8px 20px;border-radius:10px;cursor:pointer;font-size:1rem}
.tabs button.on{background:var(--az);color:#fff}
main{display:grid;grid-template-columns:190px minmax(0,1fr) 340px;gap:14px;max-width:1380px;margin:0 auto;padding:8px 14px 28px;align-items:start}
body.quiz .side{display:none}body.quiz main{grid-template-columns:minmax(0,1fr) 340px}
.card{background:#fff;border:2px solid var(--az);border-radius:14px;padding:12px}
.side h2,.panel h2{margin:0 0 8px;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;color:var(--az)}
.side button{display:flex;width:100%;justify-content:space-between;margin-bottom:6px;padding:9px 10px;border-radius:9px;border:1px solid #c9d4f2;background:#f5f8ff;cursor:pointer;font-weight:600;color:var(--tx)}
.side button.on{background:var(--az);color:#fff}.side{max-height:78vh;overflow:auto}.sh .v{color:#a33;font-style:normal;display:block;margin-top:3px;font-size:.78rem}.side p{font-size:.78rem;color:#55618a;margin:8px 0 0}
#mapbox{position:relative;border:3px solid var(--az);border-radius:14px;background:#cfe3f7;overflow:hidden;height:min(74vh,680px);touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab}
path.c{fill:#e3e6ea;stroke:#fff;stroke-width:.7;vector-effect:non-scaling-stroke;fill-rule:evenodd}
path.c.p{fill:#a9c4f5;cursor:pointer}path.c.p:hover{fill:#ffe27a}
path.c.sel{fill:#ffcc00}path.c.ok{fill:var(--ok)!important}path.c.ko{fill:var(--ko)!important}path.c.rv{fill:#ffcc00!important;stroke:#0e1b3d;stroke-width:2}
.zb{position:absolute;right:10px;display:flex;flex-direction:column;gap:6px;bottom:10px}
.zb button{width:34px;height:34px;border-radius:50%;border:0;background:var(--az);color:#fff;font-size:1.2rem;cursor:pointer}
#tip{position:fixed;pointer-events:none;background:#0e1b3d;color:#fff;padding:3px 8px;border-radius:6px;font-size:.8rem;display:none;z-index:9}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-bottom:10px;color:#44507a}.stats b{color:var(--tx)}
.big{display:flex;justify-content:center;padding:14px 0;background:#f1f5ff;border-radius:10px;margin-bottom:10px}
.q{font-weight:700;text-align:center;margin:4px 0 10px}
.fb{border-radius:10px;padding:10px;font-size:.9rem;line-height:1.35;margin-bottom:10px}
.fb.ok{background:#e6f7ec;border:1px solid var(--ok)}.fb.ko{background:#fdecea;border:1px solid var(--ko)}.fb.nr{background:#fff6d6;border:1px solid #e2b800}
.btn{width:100%;padding:10px;border:0;border-radius:10px;background:var(--az);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}.answerbox{margin:10px 0;background:#f5f8ff;border:2px solid var(--az);border-radius:12px;padding:10px;text-align:center}.answerbox .answer{display:none;margin-top:9px;background:#fff6d6;border:1px solid #e2b800;border-radius:9px;padding:9px;font-weight:800;color:var(--tx)}.answerbox .hint{font-size:.8rem;color:#55618a;margin-top:5px}
.sh{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #e1e7f7}.sh:last-child{border:0}
.sh>svg{justify-self:center;max-width:100px;height:auto}.sh .t{font-size:.84rem;line-height:1.3}.sh .t b{display:block;font-size:.92rem}.sh .t i{color:#8a5a00;font-style:normal;display:block;margin-top:3px}
.shared{background:#fff6d6;border:1px solid #e2b800;border-radius:10px;padding:8px;font-size:.82rem;margin-top:8px}
@media(max-width:980px){main,body.quiz main{grid-template-columns:1fr}.side{display:none!important}#mapbox{height:60vh}}

{id:'sk-d',isos:['SK'],kind:'Autopista (D) · Diaľnica',c:'red',shape:'aut',codes:['D1','D2','D3'],note:'Escudo rojo de forma de autopista, con la D delante del número.',sim:['CZ']},
{id:'se-r',isos:['SE'],kind:'Ruta nacional (riksväg)',c:'blue',codes:['40','50','66'],note:'Cuadro con solo el número. Las E verdes son lo más común.',v:1},
{id:'dk-r',isos:['DK'],kind:'Ruta principal · Rute',c:'yellow',codes:['15','21','16','18'],note:'Cartucho amarillo con número negro; el número de ruta aparece en placas amarillas como la 15.',v:1},
{id:'fi-vt',isos:['FI'],kind:'Carretera nacional · Valtatie',c:'fiRed',shape:'sq',codes:['4','9','29','25'],note:'Escudo rojo cuadrado con borde blanco y número blanco para las carreteras nacionales finlandesas.'},
{id:'bg-a',isos:['BG'],kind:'Autopista (A) · Avtomagistrala',c:'bgGreen',shape:'rect',codes:['A1','A2','A3','A4'],note:'Escudo verde con A y número blanco.'},
{id:'gr-eo',isos:['GR'],kind:'Carretera nacional (E.O.) · Ethniki Odos',c:'green',shape:'diamond',codes:['1','2','8','91'],note:'Escudo verde en forma de rombo/escudo para numeración nacional.'},
{id:'hu-m',isos:['HU'],kind:'Autopista (M) · Autópálya',c:'blue',shape:'pent',codes:['M1','M3','M5','M7'],note:'Escudo azul pentagonal con M y número blanco.'},
{id:'hu-main',isos:['HU'],kind:'Carretera principal',c:'green',shape:'pent',codes:['1','2','3','4','5'],note:'Las carreteras principales húngaras usan un escudo verde pentagonal con solo el número.'},
{id:'ro-dn',isos:['RO'],kind:'Carretera nacional (DN) · Drum național',c:'ukrRed',shape:'ro',codes:['1','7','2','6'],note:'Escudo rojo característico de Rumania con solo el número; la sigla DN no se imprime dentro del escudo.'},
{id:'si-a',isos:['SI'],kind:'Autopista (A) · Avtocesta',c:'green',shape:'hex',codes:['A1','A2','A3','A4'],note:'Escudo verde hexagonal con A y número blanco.'},
{id:'tr-d',isos:['TR'],kind:'Carretera estatal (D) · Devlet yolu',c:'meBlue',shape:'aut',codes:['D100','D650','D750','D850'],note:'Escudo azul con D y número; no lleva punto después de la D.'},
{id:'rs-a',isos:['RS'],kind:'Autopista (A)',c:'green',shape:'rect',codes:['A1','A2','A3'],note:'Las autopistas serbias aparecen en cartucho verde con A y número.'},
{id:'me-r',isos:['ME'],kind:'Ruta regional (R)',c:'white',codes:['R-4','R-5','R-15','R-16'],note:'Cartucho claro para rutas regionales R de Montenegro, con la letra y el número.'}];
const acc=s=>new Set([...s.isos,...(s.sim||[])]);
const $=q=>document.querySelector(q);
function shield(code,c,h,o){o=o||{};const [bg,fg]=COL[c],H=44,sh=o.shape||'rr',E='#1d1d1d';
const cw=x=>x==='M'||x==='W'?20:x===' '?7:x==='1'?11:15;const tw=[...code].reduce((a,x)=>a+cw(x),0);
const sym=sh==='uk'||sh==='ie'?40:0,w=sh==='sq'?44:sh==='pent'||sh==='hex'||sh==='aut'||sh==='it'||sh==='diamond'||sh==='ro'?76:sh==='nl'?Math.max(58,tw+22):Math.max(54,tw+30+sym);
const cx=sh==='uk'?(sym+w)/2:sh==='ie'?(w-sym)/2:w/2;
const P=(pts)=>pts.map(q=>q.join(',')).join(' ');
const aut=i=>P([[i,H*.38],[w*.2,i],[w*.8,i],[w-i,H*.38],[w-i,H*.62],[w*.8,H-i],[w*.2,H-i],[i,H*.62]]);
const ita=i=>P([[w*.1,i],[w*.9,i],[w-i,H*.28],[w-i,H*.72],[w*.9,H-i],[w*.1,H-i],[i,H*.72],[i,H*.28]]);
const hex=i=>P([[w*.18,i],[w*.82,i],[w-i,H*.5],[w*.82,H-i],[w*.18,H-i],[i,H*.5]]);
const rc=(i,r,f,st,sw)=>`<rect x="${i}" y="${i}" width="${w-2*i}" height="${H-2*i}" rx="${r}" fill="${f}" stroke="${st}" stroke-width="${sw}"/>`;
const mw=(x,col,gap)=>`<g transform="translate(${x} 7)"><polygon points="11,6 19,6 30,30 0,30" fill="${col}"/><rect x="-1" y="2" width="32" height="3" fill="${col}"/><polygon points="14.4,8 15.6,8 15.9,30 14.1,30" fill="${gap}"/></g>`;
let g='';
if(sh==='rr')g=rc(1,7,bg,E,1.2)+rc(4.5,4,'none',fg,2);
else if(sh==='rect')g=rc(1,2,bg,E,1.2)+rc(4.5,1,'none',fg,2);
else if(sh==='sq'){const z=Math.min(w,H);const x=(w-z)/2;g=rc(x,2,bg,E,1.2)+`<rect x="${x+4.5}" y="4.5" width="${z-9}" height="${z-9}" rx="1" fill="none" stroke="${fg}" stroke-width="2"/>`;}
else if(sh==='nl'){const nw=Math.max(58,tw+22);const x=(w-nw)/2;g=rc(x,7,bg,E,1.2)+`<rect x="${x+4.5}" y="4.5" width="${nw-9}" height="${H-9}" rx="4" fill="none" stroke="${fg}" stroke-width="2"/>`;}
else if(sh==='plain')g=rc(1,3,bg,'rgba(0,0,0,.4)',1);
else if(sh==='aut')g=`<polygon points="${aut(1.5)}" fill="${bg}" stroke="${E}" stroke-width="1.2" stroke-linejoin="round"/><polygon points="${aut(5)}" fill="none" stroke="${fg}" stroke-width="2" stroke-linejoin="round"/>`;
else if(sh==='it')g=`<polygon points="${ita(1.5)}" fill="${bg}" stroke="${E}" stroke-width="1.2" stroke-linejoin="round"/><polygon points="${ita(5)}" fill="none" stroke="${fg}" stroke-width="2" stroke-linejoin="round"/>`;
else if(sh==='uk')g=rc(1,5,bg,E,1)+mw(6,fg,bg);
else if(sh==='ie')g=rc(1,6,'#fff',E,1)+rc(3.5,3,bg,'none',0)+mw(w-38,fg,bg);
else if(sh==='pent'){const q=[[3,3],[w-3,3],[w-3,H*.68],[w*.5,H-3],[3,H*.68]];g=`<polygon points="${P(q)}" fill="${bg}" stroke="${E}" stroke-width="1.2" stroke-linejoin="round"/><polyline points="${P([[7,7],[w-7,7],[w-7,H*.62],[w*.5,H-8],[7,H*.62],[7,7]])}" fill="none" stroke="${fg}" stroke-width="2"/>`;}
else if(sh==='hex')g=`<polygon points="${hex(1.5)}" fill="${bg}" stroke="${E}" stroke-width="1.2" stroke-linejoin="round"/><polygon points="${hex(5)}" fill="none" stroke="${fg}" stroke-width="2" stroke-linejoin="round"/>`;
else if(sh==='diamond'){const q=[[w*.5,2],[w-3,H*.5],[w*.5,H-2],[3,H*.5]];g=`<polygon points="${P(q)}" fill="${bg}" stroke="${E}" stroke-width="1.2" stroke-linejoin="round"/><polygon points="${P([[w*.5,6],[w-7,H*.5],[w*.5,H-6],[7,H*.5]])}" fill="none" stroke="${fg}" stroke-width="2" stroke-linejoin="round"/>`;}
else if(sh==='ro'){g=`<path d="M6 10 Q ${w*.24} 17 ${w*.5} 10 Q ${w*.76} 17 ${w-6} 10 Q ${w-1} 20 ${w-7} 29 Q ${w*.82} 41 ${w*.5} ${H-1} Q ${w*.18} 41 7 29 Q 1 20 6 10 Z" fill="${bg}" stroke="${E}" stroke-width="1.2"/><path d="M10 12 Q ${w*.25} 20 ${w*.5} 13 Q ${w*.75} 20 ${w-10} 12 Q ${w-5} 20 ${w-11} 28 Q ${w*.8} 38 ${w*.5} ${H-5} Q ${w*.2} 38 11 28 Q 5 20 10 12 Z" fill="none" stroke="${fg}" stroke-width="2"/>`;}
return `<svg width="${w*h/H}" height="${h}" viewBox="0 0 ${w} ${H}">${g}<text x="${cx}" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="24" fill="${fg}">${code.replace(/ /g,'\u00a0')}</text></svg>`}
$('#stars').innerHTML=[...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return `<circle cx="${30+18*Math.sin(a)}" cy="${30-18*Math.cos(a)}" r="2.6"/>`}).join('');
// ---- mapa
const svg=$('#map');let vb={x:D.view[0],y:D.view[1],w:D.view[2],h:D.view[3]};const B={...vb};
svg.innerHTML=D.map.map(c=>`<path class="c${c.play?' p':''}" data-i="${c.iso}" d="${c.d}"/>`).join('');
const P={};svg.querySelectorAll('path').forEach(p=>P[p.dataset.i]=p);
const setVB=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);setVB();
function clamp(){vb.w=Math.min(vb.w,B.w);vb.h=Math.min(vb.h,B.h);vb.x=Math.max(B.x,Math.min(vb.x,B.x+B.w-vb.w));vb.y=Math.max(B.y,Math.min(vb.y,B.y+B.h-vb.h))}
function zoom(f,cx,cy){const r=svg.getBoundingClientRect();const px=cx==null?.5:(cx-r.left)/r.width,py=cy==null?.5:(cy-r.top)/r.height;
const nw=Math.max(B.w/40,Math.min(B.w,vb.w*f)),k=nw/vb.w;vb.x+=(vb.w-nw)*px;vb.y+=(vb.h-vb.h*k)*py;vb.w=nw;vb.h*=k;clamp();setVB()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});
$('#zi').onclick=()=>zoom(1/1.5);$('#zo').onclick=()=>zoom(1.5);$('#zr').onclick=()=>{vb={...B};setVB()};
function focus(iso){const c=D.map.find(m=>m.iso===iso);if(!c)return;const [x0,y0,x1,y1]=c.bb;let w=(x1-x0)*1.6+30,h=(y1-y0)*1.6+30;const A=B.w/B.h;if(w/h<A)w=h*A;else h=w/A;
vb={x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h};clamp();setVB()}
let drag=null,moved=false;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};moved=false});
addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)moved=true;
if(moved){vb.x=drag.vx-dx*vb.w/r.width;vb.y=drag.vy-dy*vb.h/r.height;clamp();setVB()}});
addEventListener('pointerup',()=>drag=null);
const tip=$('#tip');
svg.addEventListener('mousemove',e=>{const i=e.target.dataset&&e.target.dataset.i;if(!i){tip.style.display='none';return}tip.textContent=D.map.find(m=>m.iso===i).name;tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px'});
svg.addEventListener('mouseleave',()=>tip.style.display='none');
svg.addEventListener('click',e=>{if(moved)return;const i=e.target.dataset&&e.target.dataset.i;if(i)mode==='quiz'?answer(i):study(i)});
// ---- modos
let mode='quiz';
function setMode(m){mode=m;document.body.className=m;$('#tq').classList.toggle('on',m==='quiz');$('#ts').classList.toggle('on',m==='study');$('#pq').style.display=m==='quiz'?'':'none';$('#ps').style.display=m==='study'?'':'none';clearMap();$('#zr').click();if(m==='quiz')render();else study(curStudy)}
$('#tq').onclick=()=>setMode('quiz');$('#ts').onclick=()=>setMode('study');
function clearMap(){Object.values(P).forEach(p=>p.classList.remove('sel','ok','ko','rv'))}
// ---- estudiar
let curStudy='PL';
$('#list').innerHTML=ALL.map(i=>`<button data-i="${i}"><span>${NAME[i]}</span><span>${S.filter(s=>s.isos.includes(i)&&s.id!=='e').length+1}</span></button>`).join('');
$('#list').onclick=e=>{const b=e.target.closest('button');if(b)study(b.dataset.i)};
function study(i){const pl=ALL.includes(i);clearMap();if(pl)curStudy=i;P[i]&&P[i].classList.add('sel');if(pl)focus(i);
document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('on',b.dataset.i===i));
if(!pl){const m=D.map.find(x=>x.iso===i);$('#ps').innerHTML=`<h2>${m.name}</h2><p>Este país todavía no tiene escudos cargados.</p>`;return}
const mine=S.filter(s=>s.isos.includes(i));
$('#ps').innerHTML=`<h2>${NAME[i]} · ${mine.length} ${mine.length==1?'escudo':'escudos'}</h2>`+mine.map(s=>{const sim=[...acc(s)].filter(x=>x!==i).map(x=>NAME[x]);const all=sim.length>=ALL.length-1;
return `<div class="sh">${shield(s.codes[0],s.c,48,s)}<div class="t"><b>${s.kind}</b>${s.note}${sim.length?`<i>⚠ También se ve en / se parece a: ${all?'casi toda Europa':sim.join(', ')}</i>`:''}${s.v?'<span class="v">🔎 Por verificar: no estoy 100% seguro de este escudo.</span>':''}</div></div>`}).join('')+
(mine.length==1?`<div class="shared">Las autopistas de Noruega (y de Suecia y Dinamarca) se señalan con la ruta europea E, en verde. Las señales nacionales todavía no las cargué.</div>`:'')+
`<div class="shared">💡 Los escudos con ⚠ no bastan para saber el país: combinalos con el idioma, los carteles y el resto de señales.</div>`}
// ---- quiz
let Q,qi,ok,streak,done,cur;const best=()=>{try{return +localStorage.getItem('escudos_best')||0}catch(e){return 0}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function start(){Q=shuffle(S);qi=0;ok=0;streak=0;done=false;cur=null;render()}
function render(){clearMap();const st=`<div class="stats"><span>Escudo <b>${Math.min(qi+1,Q.length)}/${Q.length}</b></span><span>Aciertos <b>${ok}</b></span><span>Racha <b>${streak}</b></span><span>Mejor <b>${best()||'--'}</b></span></div>`;
if(qi>=Q.length){try{if(ok>best())localStorage.setItem('escudos_best',ok)}catch(e){}
$('#pq').innerHTML=`<h2>Quiz</h2><div class="fb ok"><b>¡Terminaste!</b><br>Aciertos: ${ok} de ${Q.length}.</div><button class="btn" id="rs">Jugar de nuevo</button>`;$('#rs').onclick=start;return}
const s=Q[qi];const code=s.codes[Math.random()*s.codes.length|0];cur={s,code,ans:false};
$('#pq').innerHTML=`<h2>Quiz</h2>${st}<div class="big">${shield(code,s.c,96,s)}</div><div class="q">¿De qué país es este escudo?<br><small style="font-weight:400">Hacé clic en el mapa</small></div><div class="answerbox"><button class="btn" id="showAns">Mostrar respuesta</button><div class="answer" id="answer">${s.isos.map(x=>NAME[x]).join(' · ')}</div><div class="hint">Podés verla cuando quieras para aprender el escudo.</div></div><div id="fb"></div><button class="btn" id="nx" style="display:none">Siguiente →</button>`;
$('#showAns').onclick=()=>{$('#answer').style.display='block';$('#showAns').style.display='none'};
$('#nx').onclick=()=>{qi++;$('#zr').click();render()}}
function answer(i){if(!cur||cur.ans)return;const fb=$('#fb');
if(!ALL.includes(i)){fb.innerHTML=`<div class="fb nr">${D.map.find(m=>m.iso===i).name} todavía no tiene escudos en el quiz. Probá con otro país.</div>`;return}
cur.ans=true;const s=cur.s,a=acc(s),own=s.isos.includes(i);const good=a.has(i);const names=s.isos.map(x=>NAME[x]).join(', ');
s.isos.forEach(x=>{if(x!==i)P[x].classList.add('rv')});P[i].classList.add(good?'ok':'ko');
if(good){ok++;streak++}else streak=0;
fb.innerHTML=`<div class="fb ${good?'ok':'ko'}"><b>${own?'✔ ¡Correcto!':good?'✔ Válido, pero ojo':'✘ No era '+NAME[i]}</b><br>${own&&s.isos.length>1?'Este escudo se usa en varios países ('+names+').':good&&!own?'Se parece al de '+names+' (era de ese país).':'Es de <b>'+names+'</b>.'}<br><b>${s.kind}</b>: ${s.note}${s.v?'<br><small>🔎 Por verificar</small>':''}</div>`;
$('#nx').style.display='';$('#nx').textContent=qi+1>=Q.length?'Ver resultado':'Siguiente →';
document.querySelector('.stats').innerHTML=`<span>Escudo <b>${qi+1}/${Q.length}</b></span><span>Aciertos <b>${ok}</b></span><span>Racha <b>${streak}</b></span><span>Mejor <b>${Math.max(best(),ok)}</b></span>`}
start();
</script></body></html>
