<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌎 GeoGuessr Plates</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --asphalt: #15171c;
    --card: #24272f;
    --line: #34383f;
    --paint: #ffc93c;
    --paint-dim: #8a7233;
    --chalk: #f2efe6;
    --muted: #9aa0ac;
    --ok: #49b675;
    --bad: #e2583a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background:
      repeating-linear-gradient(180deg, transparent 0 46px, rgba(255,201,60,0.05) 46px 50px),
      var(--asphalt);
    color: var(--chalk);
  }

  header {
    background: var(--card);
    padding: 24px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }

  .back-link {
    display: inline-block;
    color: var(--muted);
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 14px;
    transition: color .15s ease;
  }
  .back-link:hover { color: var(--paint); }

  header h1 {
    margin: 0 0 15px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: .01em;
  }

  .mode-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .mode-buttons button {
    padding: 10px 25px;
    border: none;
    border-radius: 999px;
    background: var(--asphalt);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }

  .mode-buttons button.active {
    background: var(--paint);
    color: #1a1a1a;
    border-color: var(--paint);
  }

  .mode-buttons button:hover {
    border-color: var(--paint-dim);
    color: var(--chalk);
  }
  .mode-buttons button.active:hover {
    color: #1a1a1a;
  }

  main {
    max-width: 1100px;
    margin: auto;
    padding: 28px 16px 60px;
  }

  .section {
    display: none;
  }

  .section.active {
    display: block;
  }


  /* =====================================================
     QUIZ
  ===================================================== */

  .quiz-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 170px;
    gap: 25px;
    align-items: start;
  }

  .quiz-container {
    text-align: center;
    min-width: 0;
  }

  .continent-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 48px;
    position: sticky;
    top: 20px;
  }

  .continent-btn {
    width: 100%;
    padding: 12px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--chalk);
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }

  .continent-btn:hover {
    border-color: var(--paint-dim);
    transform: translateX(-2px);
  }

  .continent-btn.active {
    background: var(--paint);
    color: #1a1a1a;
    border-color: var(--paint);
  }

  .quiz-continent-label {
    margin-top: 5px;
    color: var(--muted);
    font-size: 14px;
    min-height: 18px;
  }

  .quiz-container h2 {
    margin-top: 5px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 20px;
  }

  .image-container {
    width: 100%;
    max-width: 750px;
    height: 350px;
    margin: 25px auto;
    background: var(--chalk);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
  }

  .image-container img {
    max-width: 95%;
    max-height: 95%;
    object-fit: contain;
    border-radius: 8px;
  }


  /* =====================================================
     BOTONES DE RESPUESTA
  ===================================================== */

  .answer-buttons {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 12px;
    width: 100%;
    max-width: 750px;
    margin: 20px auto;
  }

  .answer-btn {
    flex: 1;
    min-width: 0;
    min-height: 55px;

    padding: 14px 20px;

    border: 1px solid var(--line);
    border-radius: 10px;

    background: var(--card);
    color: var(--chalk);

    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;

    cursor: pointer;
    text-align: center;

    transition:
      background .15s ease,
      border-color .15s ease,
      transform .1s ease;
  }

  .answer-btn:hover:not(:disabled) {
    border-color: var(--paint-dim);
    transform: translateY(-2px);
  }

  .answer-btn:disabled {
    cursor: default;
  }

  .answer-btn.correct {
    background: rgba(73,182,117,0.18);
    border-color: var(--ok);
    color: var(--ok);
  }

  .answer-btn.incorrect {
    background: rgba(226,88,58,0.18);
    border-color: var(--bad);
    color: var(--bad);
  }


  /* =====================================================
     RESULTADO
  ===================================================== */

  #result {
    margin-top: 16px;
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 600;
    min-height: 25px;
  }

  #explanation {
    max-width: 750px;
    margin: 14px auto;

    padding: 16px;

    background: var(--card);
    border: 1px solid var(--line);

    border-radius: 10px;

    color: var(--muted);

    line-height: 1.5;
    font-size: 14.5px;

    min-height: 20px;
  }

  .next-btn {
    background: var(--paint);
    color: #1a1a1a;

    margin-top: 14px;

    padding: 13px 25px;

    border: none;
    border-radius: 10px;

    cursor: pointer;

    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
  }

  .next-btn:hover {
    background: #ffd766;
  }

  .next-btn:disabled {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: default;
  }

  .stats {
    margin-top: 20px;
    font-family: 'Oswald', sans-serif;
    color: var(--muted);
    font-size: 14px;
  }


  /* =====================================================
     ESTUDIAR
  ===================================================== */

  .study-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
  }

  .study-controls input,
  .study-controls select {
    padding: 12px;

    border-radius: 10px;

    border: 1px solid var(--line);

    background: var(--card);

    color: var(--chalk);
    font-family: 'Inter', sans-serif;

    font-size: 15px;
  }

  .study-controls input {
    flex: 1;
    min-width: 220px;
  }

  .study-controls select {
    min-width: 180px;
  }


  /* =====================================================
     TARJETAS DE ESTUDIO
  ===================================================== */

  .study-grid {
    display: grid;

    grid-template-columns:
      repeat(auto-fit, minmax(280px, 1fr));

    gap: 20px;
  }

  .study-card {
    background: var(--card);

    border: 1px solid var(--line);

    border-radius: 12px;

    overflow: hidden;
  }

  .study-image {
    width: 100%;
    height: 180px;

    background: var(--chalk);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
  }

  .study-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;
  }

  .no-image {
    color: var(--muted);

    font-size: 14px;

    text-align: center;

    padding: 20px;
  }

  .study-content {
    padding: 16px;
  }

  .study-content h3 {
    margin: 0 0 5px;

    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 19px;
  }

  .continent {
    color: var(--paint);

    font-family: 'Oswald', sans-serif;
    font-size: 13px;

    margin-bottom: 10px;
  }

  .study-content p {
    color: var(--muted);

    line-height: 1.5;

    margin: 10px 0;
    font-size: 14.5px;
  }

  .tags {
    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 10px;
  }

  .tag {
    background: var(--asphalt);
    border: 1px solid var(--line);

    color: var(--muted);

    padding: 5px 9px;

    border-radius: 999px;

    font-size: 12px;
  }


  /* =====================================================
     MÓVIL
  ===================================================== */

  @media (max-width: 600px) {

    header h1 {
      font-size: 21px;
    }

    main {
      padding: 20px 14px 50px;
    }

    .quiz-layout {
      display: flex;
      flex-direction: column;
    }

    .continent-buttons {
      order: -1;
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      margin-top: 0;
      position: static;
      justify-content: center;
    }

    .continent-btn {
      width: auto;
      flex: 1 1 120px;
    }

    .image-container {
      height: 250px;
    }

    .answer-buttons {
      gap: 8px;
    }

    .answer-btn {
      padding: 10px 8px;
      font-size: 14px;
    }

    .study-grid {
      grid-template-columns: 1fr;
    }
  }

</style>
</head>


<body>


<header>

<a href="index.html" class="back-link">← Volver al Menú</a>


    <h1>🌎 GeoGuessr Plates</h1>

    <div class="mode-buttons">

        <button
            id="quizModeBtn"
            class="active"
            onclick="showMode('quiz')">

            🎯 Quiz

        </button>

        <button
            id="studyModeBtn"
            onclick="showMode('study')">

            📚 Estudiar

        </button>

    </div>

</header>



<main>


    <!-- =====================================================
         QUIZ
    ===================================================== -->

    <section
        id="quizSection"
        class="section active">

        <div class="quiz-layout">

            <div class="quiz-container">

                <h2>
                    ¿De qué país es esta matrícula?
                </h2>

                <div id="quizContinentLabel" class="quiz-continent-label">
                    🌐 Todos los continentes
                </div>


            <div class="image-container">

                <img
                    id="quizImage"
                    src=""
                    alt="Matrícula">

            </div>


            <!-- BOTONES DE RESPUESTA -->

            <div
                id="answerButtons"
                class="answer-buttons">

                <button
                    id="answerButton1"
                    class="answer-btn"
                    onclick="selectAnswer(0)">
                </button>

                <button
                    id="answerButton2"
                    class="answer-btn"
                    onclick="selectAnswer(1)">
                </button>

            </div>


            <div id="result"></div>


            <div id="explanation"></div>


            <button
                id="nextButton"
                class="next-btn"
                onclick="nextQuestion()"
                disabled>

                Siguiente ➜

            </button>


            <div class="stats">

                Aciertos:
                <span id="score">0</span>

                /

                Respondidas:
                <span id="answered">0</span>

            </div>

            </div>

            <aside class="continent-buttons" aria-label="Seleccionar continente">

                <button
                    class="continent-btn active"
                    data-continent="Todos"
                    onclick="selectQuizContinent('Todos')">
                    🌐 Todos
                </button>

                <button
                    class="continent-btn"
                    data-continent="America"
                    onclick="selectQuizContinent('America')">
                    🌎 América
                </button>

                <button
                    class="continent-btn"
                    data-continent="Europa"
                    onclick="selectQuizContinent('Europa')">
                    🌍 Europa
                </button>

                <button
                    class="continent-btn"
                    data-continent="Africa"
                    onclick="selectQuizContinent('Africa')">
                    🌍 África
                </button>

                <button
                    class="continent-btn"
                    data-continent="Asia"
                    onclick="selectQuizContinent('Asia')">
                    🌏 Asia
                </button>

            </aside>

        </div>

    </section>



    <!-- =====================================================
         ESTUDIAR
    ===================================================== -->

    <section
        id="studySection"
        class="section">


        <h2>
            📚 Estudiar matrículas
        </h2>


        <div class="study-controls">


            <input
                type="text"
                id="studySearch"
                placeholder="Buscar país..."
                oninput="renderStudy()">


            <select
                id="continentFilter"
                onchange="renderStudy()">

                <option value="Todos">
                    🌎 Todos
                </option>

                <option value="America">
                    🌎 América
                </option>

                <option value="Europa">
                    🌍 Europa
                </option>

                <option value="Asia">
                    🌏 Asia
                </option>

                <option value="Africa">
                    🌍 África
                </option>

            </select>


        </div>


        <div
            id="studyGrid"
            class="study-grid">
        </div>


    </section>


</main>

/* =========================================================
   VARIABLES
========================================================= */

let currentQuestion = null;

let answerOptions = [];

let score = 0;

let answered = 0;

let questionAnswered = false;
let selectedQuizContinent = "Todos";


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}


/* =========================================================
   PAÍSES CON IMAGEN DE QUIZ
========================================================= */

function availableQuizCountries() {

    return countries.filter(country =>
        country.quizImage &&
        country.quizImage.trim() !== "" &&
        (
            selectedQuizContinent === "Todos" ||
            country.continent === selectedQuizContinent
        )
    );

}


/* =========================================================
   MEZCLAR ARRAY
========================================================= */

function shuffle(array) {

    const newArray = [...array];

    for (
        let i = newArray.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            newArray[i],
            newArray[j]
        ] =
        [
            newArray[j],
            newArray[i]
        ];

    }

    return newArray;

}


/* =========================================================
   SELECCIONAR CONTINENTE DEL QUIZ
========================================================= */

function selectQuizContinent(continent) {

    selectedQuizContinent = continent;

    document.querySelectorAll(".continent-btn").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.continent === continent
        );
    });

    const label = document.getElementById("quizContinentLabel");

    if (continent === "Todos") {
        label.textContent = "🌐 Todos los continentes";
    } else {
        label.textContent = "Modo: " + getContinentName(continent);
    }

    nextQuestion();
}


/* =========================================================
   SIGUIENTE PREGUNTA
========================================================= */

function nextQuestion() {

    const available =
        availableQuizCountries();


    if (available.length < 2) {

        document.getElementById("quizImage").style.display =
            "none";

        document.getElementById("result").textContent =
            selectedQuizContinent === "Todos"
                ? "Se necesitan al menos 2 países con imágenes."
                : "Este continente necesita al menos 2 países con imágenes.";

        document.getElementById("explanation").textContent = "";
        document.getElementById("nextButton").disabled = true;

        return;

    }


    const randomIndex =
        Math.floor(
            Math.random() * available.length
        );


    currentQuestion =
        available[randomIndex];


    /* Elegir país incorrecto */

    const wrongCountries =
        available.filter(country =>
            country.country !==
            currentQuestion.country
        );


    const wrongCountry =
        wrongCountries[
            Math.floor(
                Math.random() *
                wrongCountries.length
            )
        ];


    /* Crear las dos opciones */

    answerOptions =
        shuffle([
            currentQuestion,
            wrongCountry
        ]);


    questionAnswered = false;


    /* Mostrar imagen */

    const image =
        document.getElementById("quizImage");


    image.style.display = "block";

    image.src =
        currentQuestion.quizImage;

    image.alt =
        "Matrícula";


    /* Mostrar botones */

    const button1 =
        document.getElementById("answerButton1");

    const button2 =
        document.getElementById("answerButton2");


    button1.textContent =
        answerOptions[0].country;

    button2.textContent =
        answerOptions[1].country;


    /* Resetear botones */

    button1.className =
        "answer-btn";

    button2.className =
        "answer-btn";


    button1.disabled = false;

    button2.disabled = false;


    /* Limpiar resultado */

    document.getElementById("result").textContent =
        "";

    document.getElementById("explanation").textContent =
        "";


    document.getElementById("nextButton").disabled =
        true;

}


/* =========================================================
   SELECCIONAR RESPUESTA
========================================================= */

function selectAnswer(index) {

    if (questionAnswered) {
        return;
    }


    questionAnswered = true;

    answered++;


    const selected =
        answerOptions[index];


    const correct =
        selected.country ===
        currentQuestion.country;


    const button1 =
        document.getElementById("answerButton1");

    const button2 =
        document.getElementById("answerButton2");


    /* Desactivar ambos */

    button1.disabled = true;

    button2.disabled = true;


    /* Marcar respuesta */

    if (correct) {

        score++;

        if (index === 0) {
            button1.classList.add("correct");
        } else {
            button2.classList.add("correct");
        }

        document.getElementById("result").textContent =
            "✅ ¡Correcto!";

    } else {

        if (index === 0) {
            button1.classList.add("incorrect");
        } else {
            button2.classList.add("incorrect");
        }


        /* Marcar también la correcta */

        if (answerOptions[0].country ===
            currentQuestion.country) {

            button1.classList.add("correct");

        } else {

            button2.classList.add("correct");

        }


        document.getElementById("result").textContent =
            "❌ Incorrecto. La respuesta era " +
            currentQuestion.country;

    }


    /* Explicación */

    document.getElementById("explanation").textContent =
        currentQuestion.description;


    /* Activar siguiente */

    document.getElementById("nextButton").disabled =
        false;


    updateStats();

}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

function updateStats() {

    document.getElementById("score").textContent =
        score;

    document.getElementById("answered").textContent =
        answered;

}


/* =========================================================
   CAMBIAR DE MODO
========================================================= */

function showMode(mode) {

    const quizSection =
        document.getElementById("quizSection");

    const studySection =
        document.getElementById("studySection");

    const quizButton =
        document.getElementById("quizModeBtn");

    const studyButton =
        document.getElementById("studyModeBtn");


    if (mode === "quiz") {

        quizSection.classList.add("active");

        studySection.classList.remove("active");

        quizButton.classList.add("active");

        studyButton.classList.remove("active");

    } else {

        quizSection.classList.remove("active");

        studySection.classList.add("active");

        quizButton.classList.remove("active");

        studyButton.classList.add("active");

        renderStudy();

    }

}


/* =========================================================
   ESTUDIO
========================================================= */

function renderStudy() {

    const grid =
        document.getElementById("studyGrid");


    const search =
        normalize(
            document.getElementById("studySearch").value
        );


    const continent =
        document.getElementById("continentFilter").value;


    const filtered =
        countries.filter(country => {

            const matchesSearch =
                normalize(country.country)
                    .includes(search);


            const matchesContinent =
                continent === "Todos" ||
                country.continent === continent;


            return matchesSearch &&
                   matchesContinent;

        });


    grid.innerHTML = "";


    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="no-image">
                No se encontraron países.
            </div>
        `;

        return;

    }


    filtered.forEach(country => {

        const card =
            document.createElement("div");


        card.className =
            "study-card";


        let imageHTML = "";


        if (
            country.studyImage &&
            country.studyImage.trim() !== ""
        ) {

            imageHTML = `

                <img
                    src="${country.studyImage}"
                    alt="Matrícula de ${country.country}"
                    onerror="
                        this.style.display='none';
                        this.parentElement.innerHTML=
                        '<div class=\\'no-image\\'>
                        Imagen de estudio pendiente
                        </div>'
                    "
                >

            `;

        } else {

            imageHTML = `

                <div class="no-image">
                    Imagen de estudio pendiente
                </div>

            `;

        }


        let tagsHTML = "";


        if (country.tags) {

            tagsHTML =
                country.tags
                    .map(tag => `
                        <span class="tag">
                            ${tag}
                        </span>
                    `)
                    .join("");

        }


        const continentName =
            getContinentName(
                country.continent
            );


        card.innerHTML = `

            <div class="study-image">

                ${imageHTML}

            </div>


            <div class="study-content">

                <h3>
                    ${country.country}
                </h3>


                <div class="continent">

                    ${continentName}

                </div>


                <p>

                    ${country.description}

                </p>


                <div class="tags">

                    ${tagsHTML}

                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* =========================================================
   NOMBRE DEL CONTINENTE
========================================================= */

function getContinentName(continent) {

    const names = {

        "America": "🌎 América",

        "Europa": "🌍 Europa",

        "Asia": "🌏 Asia",

        "Africa": "🌍 África"

    };


    return names[continent] ||
           continent;

}


/* =========================================================
   INICIAR
========================================================= */

nextQuestion();

renderStudy();

</script>
