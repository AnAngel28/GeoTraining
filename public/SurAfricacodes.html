    selectedZone=z;
    buttons.forEach(b=>b.classList.toggle('active',b===btn));
    zoneNameEl.textContent=zoneNames[z];
    startQuestion();
  });
});

function refreshCorrectMarks(){
  document.querySelectorAll('.target.correct').forEach(el=>el.classList.remove('correct'));
  answeredCodes.forEach(id=>{
    const el=document.querySelector('.target[data-id="'+id+'"]');
    if(el) el.classList.add('correct');
  });
}

document.getElementById('resetZoneBtn').addEventListener('click',()=>{
  if(selectedZone===null){
    hintEl.textContent='Selecciona una zona individual para reiniciarla';
    return;
  }
  targets.filter(t=>t.zone===selectedZone).forEach(t=>answeredCodes.delete(t.id));
  document.querySelectorAll('.target.zone-'+selectedZone+'.correct').forEach(el=>el.classList.remove('correct'));
  startQuestion();
  hintEl.textContent='Zona reiniciada';
});

document.getElementById('resetAllBtn').addEventListener('click',()=>{
  answeredCodes.clear();
  document.querySelectorAll('.target.correct').forEach(el=>el.classList.remove('correct'));
  startQuestion();
  hintEl.textContent='Todo reiniciado';
});

renderTargets();
renderStudyLabels();
resetZoom();
startQuestion();
</script>
</body>
</html>
