<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distritos de Indonesia · Quiz</title>
<style>
  :root{
    --ink:#12202b;
    --paper:#f3f1ea;
    --panel:#ffffff;
    --line:#d8d3c4;
    --navy:#1f3b4d;
    --navy-dark:#152a37;
    --gold:#c8952a;
    --sea:#a9c4c9;
    --land:#cdd6c9;
    --land-hover:#0a0a0a;
    --ok:#2f8f4e;
    --bad:#c0392b;
    --reveal:#e0b400;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: "Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--navy);
    color:#f3ead9;
    padding:14px 20px 0 20px;
    flex-shrink:0;
    position:relative;
  }
  .back-link{
    position:absolute;
    top:14px;
    right:20px;
    font-family:"Trebuchet MS",system-ui,sans-serif;
    font-size:.85rem;
    color:#f3ead9;
    text-decoration:none;
    background:rgba(255,255,255,.10);
    padding:6px 12px;
    border-radius:999px;
    transition:background .15s;
  }
  .back-link:hover{ background:rgba(255,255,255,.20); }
  header h1{
    margin:0 0 12px 0;
    font-size:1.35rem;
    font-weight:600;
    letter-spacing:.02em;
  }
  header h1 .sub{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    font-size:.72rem;
    font-weight:400;
    display:block;
    color:#c9d6da;
    margin-top:2px;
    letter-spacing:.03em;
  }
  .tabs{
    display:flex;
    gap:2px;
  }
  .tab-btn{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    background:rgba(255,255,255,.08);
    color:#d9e2e5;
    border:none;
    border-bottom:3px solid transparent;
    padding:9px 20px;
    font-size:.92rem;
    cursor:pointer;
    border-radius:6px 6px 0 0;
    transition:background .15s;
  }
  .tab-btn:hover{ background:rgba(255,255,255,.16); }
  .tab-btn.active{
    background:var(--paper);
    color:var(--navy-dark);
    border-bottom-color:var(--gold);
    font-weight:600;
  }
  main{
    flex:1;
    min-height:0;
    position:relative;
  }
  .panel{
    display:none;
    position:absolute;
    inset:0;
    flex-direction:column;
  }
  .panel.active{ display:flex; }

  .hud{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    flex-shrink:0;
  }
  .prompt{ font-size:1.02rem; }
  .prompt .target{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:700;
    color:var(--navy-dark);
    font-size:1.18rem;
  }
  .stats{ font-size:.82rem; color:#5a5850; display:flex; gap:14px; }
  .stats b{ color:var(--ink); }

  .map-wrap{
    flex:1;
    position:relative;
    overflow:hidden;
    background:var(--sea);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.10), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(255,255,255,.08), transparent 55%);
    touch-action:none;
    cursor:grab;
  }
  .map-wrap.dragging{ cursor:grabbing; }
  svg.map-svg{
    width:100%;
    height:100%;
    display:block;
  }
  path.province{
    fill:var(--land);
    stroke:#5a6b56;
    vector-effect:non-scaling-stroke;
    stroke-width:0.9;
    cursor:pointer;
    transition:fill .12s ease;
  }
  path.province.zone-active{ fill:#a7b6a1; }
  path.province.hover{ fill:var(--land-hover); }
  path.province.correct{ fill:var(--ok); }
  path.province.incorrect{ fill:var(--bad); }
  path.province.reveal{ fill:var(--reveal); }
  path.province.done{ fill:#7fae86; }

  text.province-label{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    fill:#20241a;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
  }
  line.label-leader{
    stroke:#55524a;
    stroke-width:.9;
    vector-effect:non-scaling-stroke;
    pointer-events:none;
  }

  .zoom-controls{
    position:absolute;
    right:16px;
    bottom:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:5;
  }
  .zoom-controls button{
    width:36px;
    height:36px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--navy-dark);
    font-size:1.1rem;
    cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .zoom-controls button:hover{ background:#fbf9f3; }

  .end-screen{
    position:absolute;
    inset:0;
    background:rgba(243,241,234,.96);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:20px;
  }
  .end-screen.hidden{ display:none; }
  .end-screen p{ font-size:1.25rem; max-width:420px; }
  .end-screen button{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    background:var(--navy);
    color:#f3ead9;
    border:none;
    padding:10px 22px;
    border-radius:8px;
    font-size:.95rem;
    cursor:pointer;
  }
  .end-screen button:hover{ background:var(--navy-dark); }

  .hint{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    font-size:.72rem;
    color:#6b6a60;
  }

  .zone-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    width:100%;
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
  }
  .zone-filter{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .zone-filter button{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    font-size:.78rem;
    padding:5px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--navy-dark);
    cursor:pointer;
  }
  .zone-filter button:hover{ background:#fbf9f3; }
  .zone-filter button.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#f3ead9;
  }
  .zone-actions{
    display:flex;
    gap:8px;
    margin-left:auto;
  }
  .zone-actions button{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    font-size:.78rem;
    padding:5px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--navy-dark);
    cursor:pointer;
  }
  .zone-actions button:hover{ background:#fbf9f3; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">&larr; Volver al menu</a>
  <h1>Distritos de Indonesia<span class="sub">Mapa interactivo · 514 kabupaten/kota</span></h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="quiz">Quiz</button>
    <button class="tab-btn" data-tab="study">Estudiar</button>
  </div>
</header>

<main>

  <section id="quiz-panel" class="panel active">
    <div class="hud">
      <div class="prompt">Encuentra: <span class="target" id="target-name">…</span></div>
      <div class="stats">
        <span>Progreso: <b id="progress">0/81</b></span>
        <span>Aciertos a la primera: <b id="score">0</b></span>
        <span class="hint">Desplázate / pellizca para hacer zoom · arrastra para mover</span>
      </div>
      <div class="zone-row">
        <div class="zone-filter" id="zone-filter"></div>
        <div class="zone-actions">
          <button id="zone-restart-btn">Reiniciar zona</button>
          <button id="zone-restart-all-btn">Reiniciar todo</button>
        </div>
      </div>
    </div>
    <div class="map-wrap" id="quiz-wrap">
      <svg class="map-svg" id="quiz-svg"><g id="quiz-g"></g></svg>
      <div class="zoom-controls">
        <button id="quiz-zoom-in" title="Acercar">+</button>
        <button id="quiz-zoom-out" title="Alejar">−</button>
        <button id="quiz-zoom-reset" title="Restablecer">⤾</button>
      </div>
      <div class="end-screen hidden" id="quiz-end">
        <p>Completaste el mapa. Acertaste <b id="final-score">0</b> de <b id="final-total">514</b> distritos a la primera.</p>
        <button id="restart-btn">Reiniciar quiz</button>
      </div>
    </div>
  </section>

  <section id="study-panel" class="panel">
    <div class="map-wrap" id="study-wrap">
      <svg class="map-svg" id="study-svg"><g id="study-g"></g></svg>
      <div class="zoom-controls">
        <button id="study-zoom-in" title="Acercar">+</button>
        <button id="study-zoom-out" title="Alejar">−</button>
        <button id="study-zoom-reset" title="Restablecer">⤾</button>
      </div>
    </div>
  </section>

</main>

function buildMap(svgEl, gEl, {withLabels}){
  svgEl.setAttribute('viewBox', VB.join(' '));
  DATA.forEach(prov=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', prov.path);
    p.setAttribute('class','province');
    p.setAttribute('data-id', prov.id);
    p.setAttribute('data-zone', prov.zone);
    gEl.appendChild(p);
  });
  let labels = null;
  if(withLabels){
    labels = [];
    DATA.forEach(prov=>{
      const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('class','label-leader');
      ln.setAttribute('opacity', 0);
      gEl.appendChild(ln);
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', prov.x);
      t.setAttribute('y', prov.y);
      t.setAttribute('class','province-label');
      t.setAttribute('font-size', 1.15);
      t.textContent = prov.name;
      gEl.appendChild(t);
      labels.push({el:t, line:ln, x:prov.x, y:prov.y});
    });
  }
  return labels;
}

// ---------- label overlap resolver ----------
// Displaces overlapping labels up/down only, and draws a thin leader line
// back to the province's true point whenever a label had to move.
function resolveLabelOverlaps(labels){
  const GAP = 0.18;
  labels.forEach(it=>{
    it.el.setAttribute('y', it.y);
    const bb = it.el.getBBox();
    it.hw = bb.width/2 + 0.05;
    it.hh = bb.height/2;
    it.dy = 0;
  });
  for(let iter=0; iter<10; iter++){
    let moved=false;
    for(let i=0;i<labels.length;i++){
      const a = labels[i];
      const ax0=a.x-a.hw, ax1=a.x+a.hw;
      for(let j=i+1;j<labels.length;j++){
        const b = labels[j];
        const bx0=b.x-b.hw, bx1=b.x+b.hw;
        if(ax1<bx0 || bx1<ax0) continue;
        const ay=a.y+a.dy, by=b.y+b.dy;
        const ay0=ay-a.hh, ay1=ay+a.hh;
        const by0=by-b.hh, by1=by+b.hh;
        if(ay1+GAP<=by0 || by1+GAP<=ay0) continue;
        const overlap = Math.min(ay1,by1)-Math.max(ay0,by0)+GAP;
        const push = overlap/2 + 0.01;
        if(ay<=by){ a.dy-=push; b.dy+=push; } else { a.dy+=push; b.dy-=push; }
        moved=true;
      }
    }
    if(!moved) break;
  }
  labels.forEach(it=>{
    const newY = it.y+it.dy;
    it.el.setAttribute('y', newY);
    if(Math.abs(it.dy) > it.hh*0.55){
      it.line.setAttribute('x1', it.x); it.line.setAttribute('y1', it.y);
      it.line.setAttribute('x2', it.x); it.line.setAttribute('y2', newY - Math.sign(it.dy)*it.hh*0.85);
      it.line.setAttribute('opacity', 1);
    } else {
      it.line.setAttribute('opacity', 0);
    }
  });
}

// ---------- zoom & pan ----------
function setupZoomPan(svgEl, gEl, wrapEl, controls, onScale){
  let scale=1, tx=0, ty=0;
  const MIN=1, MAX=45;

  function apply(){
    gEl.setAttribute('transform', `translate(${tx} ${ty}) scale(${scale})`);
    if(onScale) onScale(scale);
  }

  function clientToUser(clientX, clientY){
    const pt = svgEl.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svgEl.getScreenCTM().inverse();
    return pt.matrixTransform(ctm);
  }

  function zoomAt(factor, clientX, clientY){
    const before = clientToUser(clientX, clientY);
    const beforeLocal = { x:(before.x - tx)/scale, y:(before.y - ty)/scale };
    scale = Math.min(MAX, Math.max(MIN, scale*factor));
    tx = before.x - beforeLocal.x*scale;
    ty = before.y - beforeLocal.y*scale;
    apply();
  }

  wrapEl.addEventListener('wheel', e=>{
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.18 : 1/1.18;
    zoomAt(factor, e.clientX, e.clientY);
  }, {passive:false});

  // NOTE: intentionally NOT using setPointerCapture on wrapEl — capturing the
  // pointer there retargets the resulting click event to wrapEl instead of
  // the province path underneath the cursor, which silently breaks clicks.
  let dragging=false, lastX=0, lastY=0, moved=false;
  wrapEl.addEventListener('pointerdown', e=>{
    if(e.button !== undefined && e.button !== 0) return;
    dragging=true; moved=false;
    lastX=e.clientX; lastY=e.clientY;
    wrapEl.classList.add('dragging');
  });
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
    const rect = svgEl.getBoundingClientRect();
    const uw = VB[2] / rect.width;
    const uh = VB[3] / rect.height;
    tx += dx*uw; ty += dy*uh;
    lastX=e.clientX; lastY=e.clientY;
    apply();
  });
  function endDrag(){
    if(!dragging) return;
    dragging=false;
    wrapEl.classList.remove('dragging');
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  const cx = VB[0]+VB[2]/2, cy = VB[1]+VB[3]/2;
  controls.in.addEventListener('click', ()=>{
    const rect = svgEl.getBoundingClientRect();
    zoomAt(1.3, rect.left+rect.width/2, rect.top+rect.height/2);
  });
  controls.out.addEventListener('click', ()=>{
    const rect = svgEl.getBoundingClientRect();
    zoomAt(1/1.3, rect.left+rect.width/2, rect.top+rect.height/2);
  });
  controls.reset.addEventListener('click', ()=>{
    scale=1; tx=0; ty=0; apply();
  });

  apply();
  return { wasDragged: ()=>moved };
}

// ---------- tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab+'-panel').classList.add('active');
  });
});

// ---------- STUDY TAB ----------
const studySvg = document.getElementById('study-svg');
const studyG = document.getElementById('study-g');
const studyLabels = buildMap(studySvg, studyG, {withLabels:true});
let studyOverlapTimer = null;
function scheduleStudyOverlapResolve(){
  clearTimeout(studyOverlapTimer);
  studyOverlapTimer = setTimeout(()=>resolveLabelOverlaps(studyLabels), 120);
}
setupZoomPan(studySvg, studyG, document.getElementById('study-wrap'), {
  in: document.getElementById('study-zoom-in'),
  out: document.getElementById('study-zoom-out'),
  reset: document.getElementById('study-zoom-reset'),
}, (scale)=>{
  const BASE = 0.55, MINF = 0.10;
  const size = Math.max(MINF, BASE/scale);
  studyLabels.forEach(it=>it.el.setAttribute('font-size', size));
  scheduleStudyOverlapResolve();
});
resolveLabelOverlaps(studyLabels);

studySvg.querySelectorAll('path.province').forEach(p=>{
  p.addEventListener('mouseenter', ()=>p.classList.add('hover'));
  p.addEventListener('mouseleave', ()=>p.classList.remove('hover'));
});

// ---------- QUIZ TAB ----------
const quizSvg = document.getElementById('quiz-svg');
const quizG = document.getElementById('quiz-g');
buildMap(quizSvg, quizG, {withLabels:false});
const quizZoom = setupZoomPan(quizSvg, quizG, document.getElementById('quiz-wrap'), {
  in: document.getElementById('quiz-zoom-in'),
  out: document.getElementById('quiz-zoom-out'),
  reset: document.getElementById('quiz-zoom-reset'),
});

const pathById = {};
quizSvg.querySelectorAll('path.province').forEach(p=>{
  pathById[p.dataset.id]=p;
});

let queue = [];
let currentTarget = null;
let firstTryScore = 0;
let answeredCount = 0;
let locked = false; // true while showing feedback colors
let currentZone = 'todas';
let TOTAL = DATA.length;

const ZONE_LABELS = {
  todas: 'Todas',
  sumatra: 'Sumatra',
  java: 'Java',
  bali_nusa: 'Bali y Nusa Tenggara',
  kalimantan: 'Kalimantan',
  sulawesi: 'Sulawesi',
  maluku: 'Maluku',
  papua: 'Papua'
};

function idToName(id){
  return DATA.find(d=>d.id===id).name;
}

function poolForZone(zone){
  return zone==='todas' ? DATA : DATA.filter(d=>d.zone===zone);
}

function applyZoneTint(){
  Object.values(pathById).forEach(p=>{
    p.classList.toggle('zone-active', currentZone!=='todas' && p.dataset.zone===currentZone);
  });
}

function newQuiz(){
  const pool = poolForZone(currentZone);
  TOTAL = pool.length;
  queue = shuffle(pool.map(d=>d.id));
  firstTryScore = 0;
  answeredCount = 0;
  locked = false;
  Object.values(pathById).forEach(p=>{
    p.classList.remove('correct','incorrect','reveal','done','hover');
  });
  applyZoneTint();
  document.getElementById('quiz-end').classList.add('hidden');
  updateStats();
  nextQuestion();
}

function updateStats(){
  document.getElementById('progress').textContent = `${answeredCount}/${TOTAL}`;
  document.getElementById('score').textContent = firstTryScore;
}

function nextQuestion(){
  if(queue.length===0){
    currentTarget=null;
    document.getElementById('target-name').textContent='—';
    document.getElementById('final-score').textContent = firstTryScore;
    document.getElementById('final-total').textContent = TOTAL;
    document.getElementById('quiz-end').classList.remove('hidden');
    return;
  }
  currentTarget = queue[0];
  document.getElementById('target-name').textContent = idToName(currentTarget);
}

let missedThisRound = false;

quizSvg.querySelectorAll('path.province').forEach(p=>{
  p.addEventListener('mouseenter', ()=>{
    if(!locked && !p.classList.contains('done')) p.classList.add('hover');
  });
  p.addEventListener('mouseleave', ()=> p.classList.remove('hover'));

  p.addEventListener('click', ()=>{
    if(locked || !currentTarget) return;
    if(quizZoom.wasDragged()) return;
    const clickedId = p.dataset.id;

    if(clickedId === currentTarget){
      p.classList.remove('hover');
      p.classList.add('correct');
      locked = true;
      if(!missedThisRound) firstTryScore++;
      answeredCount++;
      updateStats();
      queue.shift();
      setTimeout(()=>{
        p.classList.remove('correct');
        p.classList.add('done');
        locked = false;
        missedThisRound = false;
        nextQuestion();
      }, 650);
    } else {
      p.classList.remove('hover');
      p.classList.add('incorrect');
      const correctPath = pathById[currentTarget];
      correctPath.classList.add('reveal');
      missedThisRound = true;
      locked = true;
      setTimeout(()=>{
        p.classList.remove('incorrect');
        correctPath.classList.remove('reveal');
        locked = false;
      }, 2000);
    }
  });
});

document.getElementById('restart-btn').addEventListener('click', newQuiz);

// ---------- zone filter (Sumatra, Java, Bali y Nusa Tenggara, Kalimantan, Sulawesi, Maluku, Papua) ----------
const zoneFilterEl = document.getElementById('zone-filter');
zoneFilterEl.innerHTML = Object.keys(ZONE_LABELS).map(z=>
  `<button data-zone="${z}" class="${z==='todas'?'active':''}">${ZONE_LABELS[z]}</button>`
).join('');
zoneFilterEl.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click', ()=>{
    zoneFilterEl.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentZone = b.dataset.zone;
    newQuiz();
  });
});

document.getElementById('zone-restart-btn').addEventListener('click', ()=>{
  newQuiz();
});

document.getElementById('zone-restart-all-btn').addEventListener('click', ()=>{
  currentZone = 'todas';
  zoneFilterEl.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x.dataset.zone==='todas'));
  newQuiz();
});

newQuiz();
</script>
