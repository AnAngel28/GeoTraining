<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Códigos de Teléfono - Francia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --asphalt: #15171c;
    --card: #24272f;
    --line: #34383f;
    --paint: #1A5FAD;
    --paint-dim: #273B50;
    --chalk: #f2efe6;
    --muted: #9aa0ac;
    --ok: #49b675;
    --bad: #e2583a;
  }

* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
body {
    background:
      repeating-linear-gradient(180deg, transparent 0 46px, rgba(26,95,173,0.06) 46px 50px),
      var(--asphalt);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    user-select:none;
}
#app {
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.back-link {
    position:fixed;
    left:16px;
    top:14px;
    z-index:30;
    color:var(--muted);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    text-decoration:none;
    transition:color .15s ease;
}
.back-link:hover { color:var(--paint); }

#tabs {
    height:58px;
    flex:none;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:8px;
    border-bottom:1px solid var(--line);
    background:var(--card);
    z-index:20;
}
.tab-btn {
    min-width:140px;
    height:46px;
    padding:0 24px;
    border:0;
    border-radius:14px 14px 0 0;
    background:var(--asphalt);
    color:var(--muted);
    font-family:'Oswald',sans-serif;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s ease;
}
.tab-btn:hover {
    color:var(--chalk);
}
.tab-btn.active {
    background:var(--paint);
    color:#fff;
}
#quizView {
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
}
#studyView {
    flex:1;
    min-height:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:12px 24px 20px;
}
#studyImage {
    display:block;
    width:auto;
    height:auto;
    max-width:min(92vw, 780px);
    max-height:calc(100vh - 105px);
    object-fit:contain;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

#top {
    height:82px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}
#title {
    position:absolute;
    left:24px;
    top:20px;
    margin:0;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--chalk);
}
#question {
    font-family:'Oswald',sans-serif;
    font-size:25px;
    font-weight:700;
    color:var(--chalk);
}
#question span {
    font-size:36px;
    margin-left:8px;
    color:var(--paint);
}
#topStats {
    position:absolute;
    right:24px;
    top:14px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    font-family:'Oswald',sans-serif;
    color:var(--muted);
}
#score {
    font-weight:600;
    color:var(--chalk);
}
#progress {
    color:var(--muted);
}
#controls {
    position:fixed;
    left:24px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:10;
}
.control-btn {
    min-width:118px;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    font-size:13px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    color:var(--chalk);
    background:var(--card);
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
}
.control-btn:hover {
    border-color:var(--paint-dim);
    transform:translateY(-2px);
}
.control-btn:active {
    transform:translateY(0);
}
#zoneReset {
    border-color:var(--paint-dim);
}
#allReset {
    border-color:var(--bad);
    color:var(--bad);
}
#main {
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
}
#mapWrap {
    position:relative;
    width:min(780px, calc(100vh - 193px), 82vw);
    aspect-ratio:780/780;
    flex:none;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}
#map {
    display:block;
    width:100%;
    height:100%;
    object-fit:fill;
}
#zones {
    width:70px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:15px;
    flex:none;
}
.zone-btn {
    width:60px;
    height:52px;
    border:0;
    border-radius:50%;
    color:#fff;
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 4px rgba(0,0,0,.35);
}
.zone-btn[data-zone="02"] { background:#d23b8f; }
.zone-btn[data-zone="03"] { background:#8b2bd0; }
.zone-btn[data-zone="04"] { background:#07920b; }
.zone-btn[data-zone="05"] { background:#ff1616; }
.zone-btn.active { outline:3px solid var(--chalk); outline-offset:2px; }
#status {
    position:fixed;
    bottom:31px;
    left:50%;
    transform:translateX(-50%);
    font-size:14px;
    font-family:'Oswald',sans-serif;
    color:var(--muted);
    white-space:nowrap;
}
#footer {
    height:34px;
    padding-right:24px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    color:var(--muted);
}
.marker {
    position:absolute;
    width:15px;
    height:15px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:2px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.45);
    z-index:3;
    pointer-events:none;
}
.marker.correct { background:var(--ok); }
.marker.wrong { background:var(--bad); }
@media(max-width:850px) {
    #tabs { height:52px; gap:5px; }
    .tab-btn { min-width:120px; height:42px; padding:0 16px; font-size:15px; }
    #studyView { padding:8px 10px 14px; }
    #studyImage { max-width:96vw; max-height:calc(100vh - 95px); }
    #title { font-size:19px; left:12px; }
    #question { font-size:20px; }
    #question span { font-size:29px; }
    #main { gap:8px; }
    #controls { left:8px; gap:7px; }
    .control-btn { min-width:92px; padding:8px 7px; font-size:11px; }
    #zones { width:55px; gap:9px; }
    .zone-btn { width:48px; height:42px; font-size:18px; }
}
</style>
</head>

<a href="index.html" class="back-link">← Volver al Menú</a>

    <div id="tabs">
        <button id="quizTab" class="tab-btn active" type="button">Quiz</button>

            <div id="controls">

                <button id="allReset" class="control-btn">⟲ Reiniciar todo</button>
            </div>

        <div id="main">

<script>
const DATA = {"02": [{"code": "33", "x": 230, "y": 195}, {"code": "98", "x": 107, "y": 237}, {"code": "96", "x": 164, "y": 233}, {"code": "97", "x": 160, "y": 264}, {"code": "99", "x": 215, "y": 250}, {"code": "40", "x": 211, "y": 296}, {"code": "51", "x": 226, "y": 344}, {"code": "31", "x": 274, "y": 195}, {"code": "35", "x": 333, "y": 161}, {"code": "32", "x": 326, "y": 201}, {"code": "37", "x": 343, "y": 242}, {"code": "33", "x": 297, "y": 219}, {"code": "43", "x": 255, "y": 252}, {"code": "43", "x": 293, "y": 262}, {"code": "41", "x": 261, "y": 299}, {"code": "47", "x": 311, "y": 305}, {"code": "54", "x": 343, "y": 287}, {"code": "38", "x": 383, "y": 268}, {"code": "48", "x": 394, "y": 322}, {"code": "54", "x": 350, "y": 340}], "03": [{"code": "21", "x": 375, "y": 109}, {"code": "22", "x": 382, "y": 145}, {"code": "44", "x": 386, "y": 177}, {"code": "20", "x": 415, "y": 103}, {"code": "27", "x": 428, "y": 130}, {"code": "28", "x": 450, "y": 129}, {"code": "23", "x": 434, "y": 163}, {"code": "24", "x": 480, "y": 164}, {"code": "26", "x": 466, "y": 203}, {"code": "25", "x": 464, "y": 245}, {"code": "25", "x": 513, "y": 257}, {"code": "86", "x": 440, "y": 275}, {"code": "86", "x": 437, "y": 318}, {"code": "85", "x": 481, "y": 347}, {"code": "80", "x": 492, "y": 301}, {"code": "84", "x": 537, "y": 341}, {"code": "84", "x": 549, "y": 280}, {"code": "84", "x": 593, "y": 289}, {"code": "81", "x": 563, "y": 310}, {"code": "89", "x": 600, "y": 262}, {"code": "88", "x": 610, "y": 217}, {"code": "83", "x": 548, "y": 221}, {"code": "29", "x": 514, "y": 202}, {"code": "82", "x": 535, "y": 182}, {"code": "87", "x": 567, "y": 198}], "04": [{"code": "70", "x": 425, "y": 362}, {"code": "73", "x": 418, "y": 402}, {"code": "71", "x": 398, "y": 439}, {"code": "72", "x": 452, "y": 441}, {"code": "66", "x": 437, "y": 478}, {"code": "66", "x": 447, "y": 507}, {"code": "67", "x": 433, "y": 535}, {"code": "67", "x": 480, "y": 511}, {"code": "68", "x": 387, "y": 566}, {"code": "68", "x": const mapWrap = document.getElementById("mapWrap");
const map = document.getElementById("map");
const codeEl = document.getElementById("code");
const statusEl = document.getElementById("status");
const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");
const zoneResetBtn = document.getElementById("zoneReset");
const allResetBtn = document.getElementById("allReset");
const zoneButtons = [...document.querySelectorAll(".zone-btn")];
const quizTab = document.getElementById("quizTab");
const studyTab = document.getElementById("studyTab");
const quizView = document.getElementById("quizView");
const studyView = document.getElementById("studyView");

let activeZone = "02";
let questions = [];
let questionIndex = 0;
let current = null;
let markers = [];
let locked = false;

// Los marcadores correctos y las estadísticas se conservan por zona.
const zoneState = {};
Object.keys(DATA).forEach(zone => {
    zoneState[zone] = {
        markers: [],
        correct: 0,
        wrong: 0,
        completed: false
    };
});

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function makeQuestions(zone) {
    // Cada coordenada es una pregunta independiente.
    // Los códigos repetidos permanecen como preguntas separadas.
    return shuffle(DATA[zone].map((p, i) => ({
        ...p,
        id: i
    })));
}

function updateStats() {
    const state = zoneState[activeZone];
    const total = DATA[activeZone].length;
    scoreEl.textContent = `Aciertos: ${state.correct} · Errores: ${state.wrong}`;
    progressEl.textContent = `Zona ${activeZone}: ${state.correct} / ${total}`;
}

function setZone(zone) {
    activeZone = zone;
    zoneButtons.forEach(b => b.classList.toggle("active", b.dataset.zone === zone));
    clearWrongMarkers();
    renderAllCorrectMarkers();
    // Al cambiar de zona NO se borra el progreso ni los marcadores de las demás zonas.
    questions = makeQuestions(zone);
    questionIndex = 0;
    if (!zoneState[zone].completed) {
        nextQuestion();
    } else {
        current = null;
        locked = true;
        codeEl.textContent = "✓";
        statusEl.textContent = "¡Completaste todos los códigos de la zona " + zone + "!";
        updateStats();
    }
    updateStats();
}

function nextQuestion() {
    if (questionIndex >= questions.length) {
        current = null;
        locked = true;
        zoneState[activeZone].completed = true;
        codeEl.textContent = "✓";
        statusEl.textContent = "¡Completaste todos los códigos de la zona " + activeZone + "!";
        updateStats();
        return;
    }

    current = questions[questionIndex++];
    codeEl.textContent = current.code;
    locked = false;
    statusEl.textContent = "Haz clic en el mapa donde corresponda el código.";
    updateStats();
}

function clearWrongMarkers() {
    markers.filter(m => m.dataset.temporary === "true").forEach(m => m.remove());
    markers = markers.filter(m => m.isConnected && m.dataset.temporary !== "true");
}

function renderAllCorrectMarkers() {
    markers.forEach(m => m.remove());
    markers = [];
    Object.values(zoneState).forEach(state => {
        state.markers.forEach(data => addMarker(data.x, data.y, "correct", false));
    });
}

function addMarker(x, y, type, temporary = false) {
    const m = document.createElement("div");
    m.className = "marker " + type;
    m.style.left = (x / 780 * 100) + "%";
    m.style.top = (y / 780 * 100) + "%";
    if (temporary) m.dataset.temporary = "true";
    mapWrap.appendChild(m);
    markers.push(m);
    return m;
}

function resetCurrentZone() {
    const state = zoneState[activeZone];
    state.markers = [];
    state.correct = 0;
    state.wrong = 0;
    state.completed = false;
    clearWrongMarkers();
    questions = makeQuestions(activeZone);
    questionIndex = 0;
    renderAllCorrectMarkers();
    nextQuestion();
    statusEl.textContent = `Zona ${activeZone} reiniciada.`;
    updateStats();
}

function resetAll() {
    Object.values(zoneState).forEach(state => {
        state.markers = [];
        state.correct = 0;
        state.wrong = 0;
        state.completed = false;
    });
    markers.forEach(m => m.remove());
    markers = [];
    activeZone = "02";
    zoneButtons.forEach(b => b.classList.toggle("active", b.dataset.zone === "02"));
    questions = makeQuestions("02");
    questionIndex = 0;
    nextQuestion();
    statusEl.textContent = "Todo el progreso ha sido reiniciado.";
    updateStats();
}

function getImagePoint(e) {
    // El mapa y DATA usan el mismo sistema de coordenadas 780x780.
    // Medimos contra mapWrap para que el clic y el marcador coincidan exactamente.
    const rect = mapWrap.getBoundingClientRect();
    return {
        x: Math.max(0, Math.min(780, (e.clientX - rect.left) * 780 / rect.width)),
        y: Math.max(0, Math.min(780, (e.clientY - rect.top) * 780 / rect.height))
    };
}

mapWrap.addEventListener("click", e => {
    if (locked || !current) return;

    const p = getImagePoint(e);

    // Un código repetido tiene varias coordenadas válidas.
    // Cualquiera de ellas da el acierto.
    const validPoints = DATA[activeZone].filter(q => q.code === current.code);

    let hit = null;
    for (const q of validPoints) {
        if (Math.hypot(p.x - q.x, p.y - q.y) <= 22) {
            hit = q;
            break;
        }
    }

    if (hit) {
        // Guardamos el marcador en el estado de la zona para que permanezca
        // visible aunque cambiemos a otra zona.
        zoneState[activeZone].markers.push({ x: hit.x, y: hit.y });
        zoneState[activeZone].correct++;
        addMarker(hit.x, hit.y, "correct");
        statusEl.textContent = "✓ Correcto";
        locked = true;
        setTimeout(nextQuestion, 650);
    } else {
        zoneState[activeZone].wrong++;
        updateStats();
        // Marca temporalmente el lugar donde hizo clic el usuario.
        const wrongMarker = addMarker(p.x, p.y, "wrong");
        statusEl.textContent = "✗ Incorrecto — sigue intentando";

        // Quitar el marcador incorrecto después de un breve tiempo.
        setTimeout(() => {
            wrongMarker.remove();
            markers = markers.filter(m => m !== wrongMarker);
        }, 900);
    }
});

zoneButtons.forEach(btn => {
    btn.addEventListener("click", () => setZone(btn.dataset.zone));
});

// Botones de reinicio
zoneResetBtn.addEventListener("click", resetCurrentZone);
allResetBtn.addEventListener("click", resetAll);

function setTab(tab) {
    const isQuiz = tab === "quiz";
    quizView.style.display = isQuiz ? "flex" : "none";
    studyView.style.display = isQuiz ? "none" : "flex";
    quizTab.classList.toggle("active", isQuiz);
    studyTab.classList.toggle("active", !isQuiz);
}

quizTab.addEventListener("click", () => setTab("quiz"));
studyTab.addEventListener("click", () => setTab("study"));

setTab("quiz");
setZone("02");
</script>
