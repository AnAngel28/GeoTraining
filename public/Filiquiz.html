<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provincias de Filipinas · Quiz</title>
<style>
  :root{
    --ink:#12202b;
    --paper:#f3f1ea;
    --panel:#ffffff;
    --line:#d8d3c4;
    --navy:#1f3b4d;
    --navy-dark:#152a37;
    --gold:#c8952a;
    --sea:#a9c4c9;
    --land:#cdd6c9;
    --land-hover:#0a0a0a;
    --ok:#2f8f4e;
    --bad:#c0392b;
    --reveal:#e0b400;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: "Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--navy);
    color:#f3ead9;
    padding:14px 20px 0 20px;
    flex-shrink:0;
  }
  header h1{
    margin:0 0 12px 0;
    font-size:1.35rem;
    font-weight:600;
    letter-spacing:.02em;
  }
  header h1 .sub{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    font-size:.72rem;
    font-weight:400;
    display:block;
    color:#c9d6da;
    margin-top:2px;
    letter-spacing:.03em;
  }
  .tabs{
    display:flex;
    gap:2px;
  }
  .tab-btn{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    background:rgba(255,255,255,.08);
    color:#d9e2e5;
    border:none;
    border-bottom:3px solid transparent;
    padding:9px 20px;
    font-size:.92rem;
    cursor:pointer;
    border-radius:6px 6px 0 0;
    transition:background .15s;
  }
  .tab-btn:hover{ background:rgba(255,255,255,.16); }
  .tab-btn.active{
    background:var(--paper);
    color:var(--navy-dark);
    border-bottom-color:var(--gold);
    font-weight:600;
  }
  main{
    flex:1;
    min-height:0;
    position:relative;
  }
  .panel{
    display:none;
    position:absolute;
    inset:0;
    flex-direction:column;
  }
  .panel.active{ display:flex; }

  .hud{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    flex-shrink:0;
  }
  .prompt{ font-size:1.02rem; }
  .prompt .target{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:700;
    color:var(--navy-dark);
    font-size:1.18rem;
  }
  .stats{ font-size:.82rem; color:#5a5850; display:flex; gap:14px; }
  .stats b{ color:var(--ink); }

  .map-wrap{
    flex:1;
    position:relative;
    overflow:hidden;
    background:var(--sea);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.10), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(255,255,255,.08), transparent 55%);
    touch-action:none;
    cursor:grab;
  }
  .map-wrap.dragging{ cursor:grabbing; }
  svg.map-svg{
    width:100%;
    height:100%;
    display:block;
  }
  path.province{
    fill:var(--land);
    stroke:#5a6b56;
    vector-effect:non-scaling-stroke;
    stroke-width:0.9;
    cursor:pointer;
    transition:fill .12s ease;
  }
  path.province.hover{ fill:var(--land-hover); }
  path.province.correct{ fill:var(--ok); }
  path.province.incorrect{ fill:var(--bad); }
  path.province.reveal{ fill:var(--reveal); }
  path.province.done{ fill:#7fae86; }

  text.province-label{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    fill:#20241a;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
    paint-order:stroke;
    stroke:#f3f1ea;
    stroke-width:.25px;
  }

  .zoom-controls{
    position:absolute;
    right:16px;
    bottom:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:5;
  }
  .zoom-controls button{
    width:36px;
    height:36px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--navy-dark);
    font-size:1.1rem;
    cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .zoom-controls button:hover{ background:#fbf9f3; }

  .end-screen{
    position:absolute;
    inset:0;
    background:rgba(243,241,234,.96);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:20px;
  }
  .end-screen.hidden{ display:none; }
  .end-screen p{ font-size:1.25rem; max-width:420px; }
  .end-screen button{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    background:var(--navy);
    color:#f3ead9;
    border:none;
    padding:10px 22px;
    border-radius:8px;
    font-size:.95rem;
    cursor:pointer;
  }
  .end-screen button:hover{ background:var(--navy-dark); }

  .hint{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    font-size:.72rem;
    color:#6b6a60;
  }

  .region-filter{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .region-filter button{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    font-size:.78rem;
    padding:5px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--navy-dark);
    cursor:pointer;
  }
  .region-filter button:hover{ background:#fbf9f3; }
  .region-filter button.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#f3ead9;
  }
  .study-toolbar{
    position:absolute;
    left:14px;
    top:14px;
    z-index:5;
    background:rgba(255,255,255,.92);
    padding:8px 10px;
    border-radius:10px;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  path.province.dimmed{ opacity:.28; }
  text.province-label.dimmed{ opacity:.28; }

  .back-to-menu{position:fixed;top:10px;right:10px;z-index:9999;background:#1A5FAD;color:#fff;text-decoration:none;padding:6px 14px;border-radius:6px;font-family:"Trebuchet MS",system-ui,sans-serif;font-size:13px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .back-to-menu:hover{background:#144a8a;}
</style>
</head>
<body>
<a href="index.html" class="back-to-menu">← Menú</a>

<header>
  <h1>Provincias de Filipinas<span class="sub">Mapa interactivo · 80 provincias · filtra por región</span></h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="quiz">Quiz</button>
    <button class="tab-btn" data-tab="study">Estudiar</button>
  </div>
</header>

<main>

  <section id="quiz-panel" class="panel active">
    <div class="hud">
      <div class="prompt">Encuentra: <span class="target" id="target-name">…</span></div>
      <div class="stats">
        <span>Progreso: <b id="progress">0/81</b></span>
        <span>Aciertos a la primera: <b id="score">0</b></span>
        <span class="hint">Desplázate / pellizca para hacer zoom · arrastra para mover</span>
      </div>
      <div class="region-filter" id="quiz-region-filter"></div>
    </div>
    <div class="map-wrap" id="quiz-wrap">
      <svg class="map-svg" id="quiz-svg"><g id="quiz-g"></g></svg>
      <div class="zoom-controls">
        <button id="quiz-zoom-in" title="Acercar">+</button>
        <button id="quiz-zoom-out" title="Alejar">−</button>
        <button id="quiz-zoom-reset" title="Restablecer">⤾</button>
      </div>
      <div class="end-screen hidden" id="quiz-end">
        <p>Completaste el mapa. Acertaste <b id="final-score">0</b> de <b id="final-total">81</b> provincias a la primera.</p>
        <button id="restart-btn">Reiniciar quiz</button>
      </div>
    </div>
  </section>

  <section id="study-panel" class="panel">
    <div class="map-wrap" id="study-wrap">
      <svg class="map-svg" id="study-svg"><g id="study-g"></g></svg>
      <div class="study-toolbar region-filter" id="study-region-filter"></div>
      <div class="zoom-controls">
        <button id="study-zoom-in" title="Acercar">+</button>
        <button id="study-zoom-out" title="Alejar">−</button>
        <button id="study-zoom-reset" title="Restablecer">⤾</button>
      </div>
    </div>
  </section>

</main>

// ---------- helpers ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildMap(svgEl, gEl, {withLabels}){
  svgEl.setAttribute('viewBox', VB.join(' '));
  DATA.forEach(prov=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', prov.path);
    p.setAttribute('class','province');
    p.setAttribute('data-id', prov.id);
    p.setAttribute('data-region', prov.region);
    gEl.appendChild(p);
  });
  let labels = null;
  if(withLabels){
    labels = [];
    DATA.forEach(prov=>{
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', prov.x);
      t.setAttribute('y', prov.y);
      t.setAttribute('class','province-label');
      t.setAttribute('data-region', prov.region);
      t.setAttribute('font-size', 1.15);
      t.textContent = prov.name;
      gEl.appendChild(t);
      labels.push(t);
    });
  }
  return labels;
}

    ty = before.y - beforeLocal.y*scale;

    apply();
  }

  apply();
  return { wasDragged: ()=>moved, fitTo };
}

// ---------- region filter ----------
function setupRegionFilter(containerEl, onChange){
  containerEl.innerHTML = Object.keys(REGION_LABELS).map(r=>
    `<button data-region="${r}" class="${r==='todas'?'active':''}">${REGION_LABELS[r]}</button>`
  ).join('');
  containerEl.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      containerEl.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      onChange(b.dataset.region);
    });
  });
}

// ---------- tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab+'-panel').classList.add('active');
  });
});

// ---------- STUDY TAB ----------
const studySvg = document.getElementById('study-svg');
const studyG = document.getElementById('study-g');
const studyLabels = buildMap(studySvg, studyG, {withLabels:true});
const studyZoom = setupZoomPan(studySvg, studyG, document.getElementById('study-wrap'), {
  in: document.getElementById('study-zoom-in'),
  out: document.getElementById('study-zoom-out'),
  reset: document.getElementById('study-zoom-reset'),
}, (scale)=>{
  const BASE = 1.15, MINF = 0.32;
  const size = Math.max(MINF, BASE/scale);
  studyLabels.forEach(t=>t.setAttribute('font-size', size));
});

studySvg.querySelectorAll('path.province').forEach(p=>{
  p.addEventListener('mouseenter', ()=>p.classList.add('hover'));
  p.addEventListener('mouseleave', ()=>p.classList.remove('hover'));
});

setupRegionFilter(document.getElementById('study-region-filter'), region=>{
  studySvg.querySelectorAll('path.province').forEach(p=>{
    p.classList.toggle('dimmed', region!=='todas' && p.dataset.region!==region);
  });
  studyLabels.forEach(t=>{
    t.classList.toggle('dimmed', region!=='todas' && t.dataset.region!==region);
  });
  studyZoom.fitTo(REGION_BBOX[region]);
});

// ---------- QUIZ TAB ----------
const quizSvg = document.getElementById('quiz-svg');
const quizG = document.getElementById('quiz-g');
buildMap(quizSvg, quizG, {withLabels:false});
const quizZoom = setupZoomPan(quizSvg, quizG, document.getElementById('quiz-wrap'), {
  in: document.getElementById('quiz-zoom-in'),
  out: document.getElementById('quiz-zoom-out'),
  reset: document.getElementById('quiz-zoom-reset'),
});

const pathById = {};
quizSvg.querySelectorAll('path.province').forEach(p=>{
  pathById[p.dataset.id]=p;
});

let queue = [];
let currentTarget = null;
let firstTryScore = 0;
let answeredCount = 0;
let locked = false; // true while showing feedback colors
let currentRegion = 'todas';
let TOTAL = DATA.length;

function idToName(id){
  return DATA.find(d=>d.id===id).name;
}

function poolForRegion(region){
  return region==='todas' ? DATA : DATA.filter(d=>d.region===region);
}

function newQuiz(){
  const pool = poolForRegion(currentRegion);
  TOTAL = pool.length;
  queue = shuffle(pool.map(d=>d.id));
  firstTryScore = 0;
  answeredCount = 0;
  locked = false;
  Object.values(pathById).forEach(p=>{
    p.classList.remove('correct','incorrect','reveal','done','hover');
    p.classList.toggle('dimmed', currentRegion!=='todas' && p.dataset.region!==currentRegion);
  });
  document.getElementById('quiz-end').classList.add('hidden');
  updateStats();
  nextQuestion();
}

function updateStats(){
  document.getElementById('progress').textContent = `${answeredCount}/${TOTAL}`;
  document.getElementById('score').textContent = firstTryScore;
}

function nextQuestion(){
  if(queue.length===0){
    currentTarget=null;
    document.getElementById('target-name').textContent='—';
    document.getElementById('final-score').textContent = firstTryScore;
    document.getElementById('final-total').textContent = TOTAL;
    document.getElementById('quiz-end').classList.remove('hidden');
    return;
  }
  currentTarget = queue[0];
  document.getElementById('target-name').textContent = idToName(currentTarget);
}

let missedThisRound = false;

quizSvg.querySelectorAll('path.province').forEach(p=>{
  p.addEventListener('mouseenter', ()=>{
    if(!locked && !p.classList.contains('done')) p.classList.add('hover');
  });
  p.addEventListener('mouseleave', ()=> p.classList.remove('hover'));

  p.addEventListener('click', ()=>{
    if(locked || !currentTarget) return;
    if(quizZoom.wasDragged()) return;
    const clickedId = p.dataset.id;

    if(clickedId === currentTarget){
      p.classList.remove('hover');
      p.classList.add('correct');
      locked = true;
      if(!missedThisRound) firstTryScore++;
      answeredCount++;
      updateStats();
      queue.shift();
      setTimeout(()=>{
        p.classList.remove('correct');
        p.classList.add('done');
        locked = false;
        missedThisRound = false;
        nextQuestion();
      }, 650);
    } else {
      p.classList.remove('hover');
      p.classList.add('incorrect');
      const correctPath = pathById[currentTarget];
      correctPath.classList.add('reveal');
      missedThisRound = true;
      locked = true;
      setTimeout(()=>{
        p.classList.remove('incorrect');
        correctPath.classList.remove('reveal');
        locked = false;
      }, 2000);
    }
  });
});

document.getElementById('restart-btn').addEventListener('click', newQuiz);

setupRegionFilter(document.getElementById('quiz-region-filter'), region=>{
  currentRegion = region;
  quizZoom.fitTo(REGION_BBOX[region]);
  newQuiz();
});

newQuiz();
</script>
</body>
</html>
